# Backtest of the base-breakout setup on long history (2016+). Manual, plus weekly on Sunday.
# Publishes backtest/breakouts.json to the data branch. Needs the same secrets as the nightly job.
name: Breakout backtest
on:
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit universe size (0 = all listed stocks)'
        default: '500'
permissions:
  contents: write
concurrency:
  group: data-branch-writer
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$ALPACA_KEY_ID" ] || [ -z "$ALPACA_SECRET_KEY" ] || [ -z "$SEC_USER_AGENT" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::비밀 값 없음 — Settings → Secrets and variables → Actions → Secrets 탭(Repository secrets)에 ALPACA_KEY_ID, ALPACA_SECRET_KEY, SEC_USER_AGENT를 등록하세요."
              exit 1
            fi
            echo "::notice::Secrets missing — scheduled backtest skipped."
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.check.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: .backtest-cache
          key: backtest-cache-${{ github.run_id }}
          restore-keys: backtest-cache-
      - if: steps.check.outputs.ok == 'true'
        name: Check out data branch
        run: |
          git fetch origin data --depth=1 || true
          if git rev-parse --verify -q origin/data >/dev/null; then git worktree add -B data data-branch origin/data
          else git worktree add --detach data-branch && cd data-branch && git checkout --orphan data && git rm -rf . -q || true; fi
      - if: steps.check.outputs.ok == 'true'
        run: node scripts/backtest.mjs --cache .backtest-cache --out data-branch --limit "${{ github.event.inputs.limit || '0' }}"
      - if: steps.check.outputs.ok == 'true'
        name: Publish
        run: |
          cd data-branch
          git add backtest
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="alpha-terminal-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "backtest: breakouts $(date -u +%F)"
          git pull --rebase -q origin data || true
          git push origin data
