name: Daily market briefing
on:
  schedule:
    # Every day 07:15 KST. Weekends/holidays retain last trading date explicitly.
    - cron: '15 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/analysis/market-brief.mjs'
      - 'packages/analysis/market-context.mjs'
      - 'packages/analysis/market-events.mjs'
      - 'packages/pipeline/market-brief.mjs'
      - 'scripts/market-brief.mjs'
      - '.github/workflows/market-brief.yml'
permissions:
  contents: write
concurrency:
  group: data-branch-writer
  cancel-in-progress: false
jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out data
        run: |
          git fetch origin data --depth=1
          git worktree add -B data data-branch origin/data
      - name: Generate briefing
        run: node scripts/market-brief.mjs --out data-branch
      - name: Publish briefing only
        run: |
          cd data-branch
          git add market-brief/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="alpha-terminal-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "data: daily market briefing"
          # other writers (telegram collector) push to data meanwhile: rebase and retry instead of failing
          for i in 1 2 3 4; do git pull --rebase -q origin data && git push -q origin HEAD:data && exit 0; sleep $((i*5)); done
          echo "::error::push to data failed after retries"; exit 1
