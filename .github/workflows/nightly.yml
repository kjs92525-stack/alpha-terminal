# Nightly all-stocks pipeline. Publishes rankings, the immutable recommendation
# ledger and performance stats to the `data` branch (public, auditable history).
#
# Required repository secrets: ALPACA_KEY_ID, ALPACA_SECRET_KEY, SEC_USER_AGENT
# ("AlphaTerminal/0.5 you@example.com"). Without them the job is skipped.
name: Nightly pipeline
on:
  # Refresh immediately when the EARLY ALPHA engine is released; the normal
  # weekday schedule and manual full-universe runs remain available.
  push:
    branches: [main]
    paths:
      - 'packages/analysis/market-brief.mjs'
      - 'packages/pipeline/market-brief.mjs'
      - 'packages/analysis/cycle.mjs'
      - 'packages/analysis/industrial-cycle.mjs'
      - 'packages/analysis/early-alpha.mjs'
      - 'packages/analysis/financial-review.mjs'
      - 'packages/analysis/sector-stories.mjs'
      - 'packages/pipeline/run.mjs'
      - 'packages/analysis/story.mjs'
      - 'packages/pipeline/finnhub.mjs'
      - 'packages/pipeline/early-alpha.mjs'
      - '.github/workflows/nightly.yml'
  schedule:
    # Backup only. The Cloudflare Worker cron (apps/api/src/nightly-kick.ts) dispatches this at
    # 16:25 New York time; GitHub's schedule has been firing 4+ hours late. When the data branch
    # is already fresh (< 8 h) the scheduled run skips itself.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit universe size (0 = all, use e.g. 200 for a smoke test)'
        default: '0'
permissions:
  contents: write
concurrency:
  group: data-branch-writer
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      # Release refresh reuses the latest fundamentals cache so the first screen
      # is ready promptly; scheduled/manual runs keep the normal API budget.
      FINNHUB_MAX_CALLS: ${{ github.event_name == 'push' && '0' || '1500' }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$ALPACA_KEY_ID" ] || [ -z "$ALPACA_SECRET_KEY" ] || [ -z "$SEC_USER_AGENT" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            missing=""
            [ -z "$ALPACA_KEY_ID" ] && missing="$missing ALPACA_KEY_ID"
            [ -z "$ALPACA_SECRET_KEY" ] && missing="$missing ALPACA_SECRET_KEY"
            [ -z "$SEC_USER_AGENT" ] && missing="$missing SEC_USER_AGENT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # a manual run without secrets must not look like a success
              echo "::error::비밀 값 없음:$missing — Settings → Secrets and variables → Actions → Secrets 탭(Repository secrets)에 등록하세요."
              exit 1
            fi
            echo "::notice::Secrets not set ($missing) — scheduled run skipped."
          elif [ "${{ github.event_name }}" = "schedule" ] && fresh=$(curl -fsS --max-time 20 https://raw.githubusercontent.com/${{ github.repository }}/data/latest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const h=(Date.now()-Date.parse(JSON.parse(s).generatedAt))/36e5;console.log(h<8?h.toFixed(1):'')})") && [ -n "$fresh" ]; then
            # The Worker cron (apps/api/src/nightly-kick.ts) already ran this right after the close;
            # GitHub's schedule fires hours late, so it is only the backup.
            echo "::notice::Data already refreshed ${fresh}h ago by the post-close start — scheduled backup skipped."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.check.outputs.ok == 'true'
        name: Restore pipeline cache (bars + SEC)
        uses: actions/cache@v4
        with:
          path: .pipeline-cache
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-
      - if: steps.check.outputs.ok == 'true'
        name: Check out data branch
        run: |
          git fetch origin data --depth=1 || true
          if git rev-parse --verify -q origin/data >/dev/null; then
            git worktree add -B data data-branch origin/data
          else
            git worktree add --detach data-branch
            cd data-branch
            git checkout --orphan data
            git rm -rf . -q || true
            printf '# ALPHA TERMINAL data\n\nGenerated nightly by .github/workflows/nightly.yml. ledger/ files are written once and never modified — see this branch history.\n' > README.md
          fi
      - if: steps.check.outputs.ok == 'true'
        name: Run pipeline
        run: node scripts/nightly.mjs --cache .pipeline-cache --out data-branch --limit "${{ github.event.inputs.limit || '0' }}"
      - if: steps.check.outputs.ok == 'true'
        name: Publish
        run: |
          cd data-branch
          # Guard: an existing ledger file must never change.
          if git rev-parse -q --verify HEAD >/dev/null && git diff --name-only --diff-filter=MD HEAD -- ledger/ early-alpha/ledger/ early-alpha/research-ledger/ | grep -v 'ledger/index.json' | grep -q .; then
            echo "::error::Existing ledger files were modified — refusing to publish."; exit 1
          fi
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          ASOF=$(node -e "console.log(require('./latest.json').asOf)")
          git -c user.name="alpha-terminal-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "data: ${ASOF}"
          # other writers (telegram collector) push to data meanwhile: rebase and retry instead of failing
          for i in 1 2 3 4; do git pull --rebase -q origin data && git push -q origin HEAD:data && exit 0; sleep $((i*5)); done
          echo "::error::push to data failed after retries"; exit 1
