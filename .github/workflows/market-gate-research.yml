# Research runs of the market gate on real Alpaca bars. Runs on pushes to research branches (or by hand)
# and only prints and uploads results — it never writes to the data branch.
name: Market gate research
on:
  push:
    branches: ['claude/market-gate-research']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$ALPACA_KEY_ID" ] || [ -z "$ALPACA_SECRET_KEY" ]; then echo "::error::ALPACA secrets missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Price-rule backtest (current rules)
        run: node scripts/market-gate-backtest.mjs --cache .backtest-cache --out research-out --start 2016-01-01
      - name: Tuning 2016-2021 / validation 2022-now
        run: node scripts/market-gate-research.mjs --cache .backtest-cache --out research-out --start 2016-01-01 --split 2022-01-01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-gate-research
          path: research-out
