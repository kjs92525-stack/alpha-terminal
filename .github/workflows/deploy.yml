# Cloudflare Git integration remains the only automatic production deployer.
# This workflow validates credentials on configuration releases and provides a
# manual fallback. Validation uploads an inactive version; it does not route traffic.
name: Cloudflare connection / manual deploy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production (false = validate credentials with an inactive version)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudflare-manual-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Register CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify existing Worker access
        run: |
          node --input-type=module <<'JS'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          const base = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}`;
          const res = await fetch(`${base}/workers/scripts/alpha-terminal/settings`, { headers });
          const result = await res.json();
          if (!res.ok || !result.success) {
            console.error(`Worker access failed (HTTP ${res.status}); confirm the account ID and Edit Cloudflare Workers permissions.`);
            process.exit(1);
          }
          console.log('Existing alpha-terminal Worker access verified.');
          // Never print token values or Worker settings/bindings.
          const subRes = await fetch(`${base}/workers/subdomain`, { headers });
          if (subRes.ok) {
            const sub = await subRes.json();
            if (sub.success && /^[a-z0-9-]+$/.test(sub.result?.subdomain ?? '')) {
              const url = `https://alpha-terminal.${sub.result.subdomain}.workers.dev`;
              console.log(`Worker URL: ${url}`);
            }
          }
          JS
      - run: npm run typecheck
      - run: npm test
      - name: Validate deployment permission without changing production traffic
        if: github.event_name != 'workflow_dispatch' || inputs.deploy != true
        run: npx wrangler versions upload --keep-vars --message "GitHub deployment connection validation"
      - name: Manual production deploy
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
        run: npx wrangler deploy --keep-vars
