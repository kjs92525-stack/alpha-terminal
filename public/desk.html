<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>알파 데스크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* Layout: a trading desk at night. Desktop = three panes (account rail · today's work · activity feed);
   phone = one column with a bottom tab bar. Cards float on a deep navy ground; colour is spent on state. */
:root {
  --ground: #1b1f3d; --pane: #222749; --card: #2a3059; --card-2: #333a69; --line: rgba(196, 204, 255, .09); --line-2: rgba(196, 204, 255, .16);
  --fg: #f3f4ff; --fg-2: #b2b7da; --muted: #7c82ad;
  --blue: #4f7dff; --violet: #7b57ff; --coral: #ff5d6c; --cyan: #2fc6f2; --mint: #36d6a0; --amber: #ffb84d;
  --up: #ff6473; --down: #5c90ff;            /* Korean market convention: red rises, blue falls */
  --display: "Manrope", "IBM Plex Sans KR", system-ui, sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r-lg: 22px; --r-md: 16px; --r-sm: 12px; --shadow: 0 22px 44px -24px rgba(5, 7, 28, .85);
  --tabbar: 68px; color-scheme: dark;
}
* { box-sizing: border-box }
html, body { background: var(--ground); color: var(--fg) }
body { margin: 0; font-family: var(--body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ground) }
button, input { font: inherit; color: inherit }
a { color: var(--cyan) }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 8px }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em }
.up { color: var(--up) } .down { color: var(--down) } .dim { color: var(--fg-2) } .mute { color: var(--muted) }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.01em }
h2 { font-size: 17px; font-weight: 700 }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; max-width: 1440px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(var(--tabbar) + 24px) }
.rail, .feed { display: none }
.main { min-width: 0; display: flex; flex-direction: column; gap: 22px }
@media (min-width: 1000px) {
  .app { grid-template-columns: 300px minmax(0, 1fr); padding-bottom: 28px }
  .rail { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 14px; align-self: start }
  .tabbar { display: none !important } .topnav { display: flex !important }
  .m-only { display: none !important }
}
@media (min-width: 1320px) { .app { grid-template-columns: 300px minmax(0, 1fr) 300px } .feed { display: flex; flex-direction: column; position: sticky; top: 14px; align-self: start; max-height: calc(100vh - 28px) } .m-feed { display: none !important } }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: -.02em }
.brand i { width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(135deg, var(--blue), var(--violet)); display: grid; place-items: center; font-style: normal; font-size: 15px; box-shadow: 0 8px 18px -8px var(--blue) }
.topnav { display: none; gap: 6px; margin-left: 18px }
.topnav button { background: none; border: 0; padding: 8px 12px; border-radius: 12px; color: var(--fg-2); font-weight: 600; cursor: pointer }
.topnav button[aria-current="page"] { color: var(--fg); background: var(--card) }
.top .grow { flex: 1 }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line-2); font-size: 12.5px; color: var(--fg-2); white-space: nowrap }
.pill b { color: var(--fg); font-weight: 600 }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted) }
.pill.ok .dot { background: var(--mint) } .pill.warn .dot { background: var(--amber) } .pill.bad .dot { background: var(--coral) }
.pill.ok { border-color: color-mix(in srgb, var(--mint) 45%, transparent) } .pill.warn { border-color: color-mix(in srgb, var(--amber) 45%, transparent) } .pill.bad { border-color: color-mix(in srgb, var(--coral) 45%, transparent) }

/* ---------- surfaces ---------- */
.card { background: var(--card); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow); min-width: 0 }
.pane { background: var(--pane); border-radius: var(--r-lg); padding: 18px; min-width: 0 }
.sec { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.sec-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.sec-h .sub { color: var(--muted); font-size: 12.5px }
.sec-h .grow { flex: 1 }
.label { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.empty { padding: 26px 18px; text-align: center; color: var(--fg-2); background: var(--pane); border-radius: var(--r-lg); border: 1.5px dashed var(--line-2) }
.empty b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 4px }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--card-2); color: var(--fg-2); font-size: 11.5px; font-weight: 600; white-space: nowrap }
.chip.blue { background: color-mix(in srgb, var(--blue) 22%, transparent); color: #a9c0ff }
.chip.violet { background: color-mix(in srgb, var(--violet) 24%, transparent); color: #c7b6ff }
.chip.mint { background: color-mix(in srgb, var(--mint) 18%, transparent); color: #8ff0cc }
.chip.amber { background: color-mix(in srgb, var(--amber) 20%, transparent); color: #ffd699 }
.chip.coral { background: color-mix(in srgb, var(--coral) 20%, transparent); color: #ffb0b8 }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 14px; border: 1.5px solid var(--blue); background: transparent; color: var(--fg); font-weight: 600; cursor: pointer }
.btn.solid { background: var(--blue); box-shadow: 0 10px 22px -12px var(--blue) }
.btn:hover { background: color-mix(in srgb, var(--blue) 16%, transparent) } .btn.solid:hover { background: #6a90ff }

/* ---------- account rail ---------- */
.acct .big { font-size: 30px; font-weight: 800 }
.acct .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.spark { height: 128px; margin: 8px -6px -6px }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.stat { border: 1.5px solid var(--line-2); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.stat .v { font-family: var(--display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums }
.stat .k { font-size: 11.5px; color: var(--muted) }
.stat.blue { border-color: color-mix(in srgb, var(--blue) 55%, transparent) } .stat.violet { border-color: color-mix(in srgb, var(--violet) 55%, transparent) }
.stat.coral { border-color: color-mix(in srgb, var(--coral) 50%, transparent) } .stat.cyan { border-color: color-mix(in srgb, var(--cyan) 50%, transparent) }
.progress { height: 6px; border-radius: 99px; background: var(--card-2); overflow: hidden }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--violet)); border-radius: inherit }

/* ---------- hero tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px }
@media (max-width: 720px) { .tiles { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) } .tiles .tile:first-child { grid-column: 1 / -1 } .tile { min-height: 112px; padding: 15px } .tile .v { font-size: 22px } .tile .glyph { font-size: 80px } }
.tile { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 18px; min-height: 132px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; border: 0; text-align: left; cursor: pointer; color: #fff; box-shadow: 0 24px 40px -22px var(--glow) }
.tile.blue { background: linear-gradient(150deg, #5f8bff, #3d63e6); --glow: #4f7dff }
.tile.violet { background: linear-gradient(150deg, #8c6bff, #6440f0); --glow: #7b57ff }
.tile.coral { background: linear-gradient(150deg, #ff7480, #f0465a); --glow: #ff5d6c }
.tile.slate { background: linear-gradient(150deg, #3b4378, #2c3262); --glow: #10142f }
.tile .glyph { position: absolute; right: -6px; top: -14px; font-family: var(--display); font-weight: 800; font-size: 104px; line-height: 1; opacity: .17; transform: rotate(-8deg); pointer-events: none }
.tile .k { font-size: 12.5px; opacity: .85; font-weight: 600 }
.tile .v { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.15 }
.tile .s { font-size: 12.5px; opacity: .85; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }

/* ---------- order / signal cards ---------- */
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px }
.oc { display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: transform .15s }
.oc:hover { transform: translateY(-2px) }
.oc-h { display: flex; align-items: center; gap: 12px }
.av { width: 40px; height: 40px; flex: none; border-radius: 13px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 12.5px; color: #fff }
.oc-h .t { min-width: 0; flex: 1 }
.oc-h .t b { font-family: var(--display); font-size: 16px; font-weight: 800; display: block }
.oc-h .t span { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.lv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.lv div { background: var(--pane); border-radius: var(--r-sm); padding: 9px 10px; min-width: 0 }
.lv span { display: block; font-size: 11px; color: var(--muted) }
.lv b { font-family: var(--display); font-size: 15px; font-variant-numeric: tabular-nums }
.lv small { display: block; font-size: 11px; font-variant-numeric: tabular-nums }
.oc-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-2); flex-wrap: wrap }
.void { opacity: .72 } .void .lv { display: none }

/* ---------- holdings ladder ---------- */
.hold { display: flex; flex-direction: column; gap: 10px }
.hr { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; background: var(--card); border-radius: var(--r-md); cursor: pointer }
.hr:hover { background: var(--card-2) }
.hr .t b { font-family: var(--display); font-weight: 800 } .hr .t span { color: var(--muted); font-size: 12px; margin-left: 6px }
.hr .r { text-align: right } .hr .r b { font-family: var(--display); font-weight: 700; font-size: 15px; display: block } .hr .r small { font-size: 11.5px; color: var(--muted) }
.ladder { position: relative; height: 6px; border-radius: 99px; margin: 9px 0 4px; background: linear-gradient(90deg, color-mix(in srgb, var(--down) 70%, transparent), var(--card-2) 40%, color-mix(in srgb, var(--up) 70%, transparent)) }
.ladder .e { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--fg-2); border-radius: 2px }
.ladder .p { position: absolute; top: -5px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--fg); border: 3px solid var(--ground); box-shadow: 0 0 0 1.5px var(--fg-2) }
.ladder-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums }

/* ---------- feed ---------- */
.feed { gap: 0; padding: 0; overflow: hidden }
.feed-h { display: flex; align-items: center; gap: 8px; padding: 16px 18px; border-bottom: 1px solid var(--line) }
.feed-list { overflow-y: auto; padding: 6px 0 }
.ev { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 11px; padding: 11px 18px }
.ev .av { width: 36px; height: 36px; border-radius: 12px; font-size: 11px }
.ev b { font-family: var(--display); font-weight: 800; font-size: 13.5px } .ev time { float: right; color: var(--muted); font-size: 11.5px }
.ev p { margin: 2px 0 0; color: var(--fg-2); font-size: 12.5px; line-height: 1.45 }

/* ---------- stock view ---------- */
.search { display: flex; gap: 10px }
.search input { flex: 1; min-width: 0; background: var(--card); border: 1.5px solid var(--line-2); border-radius: 14px; padding: 11px 14px; font-size: 15px; text-transform: uppercase }
.search input::placeholder { text-transform: none; color: var(--muted) }
.chips { display: flex; gap: 8px; flex-wrap: wrap }
.chips button { border: 1.5px solid var(--line-2); background: none; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-family: var(--display); font-size: 12.5px; cursor: pointer; color: var(--fg-2) }
.chips button:hover, .chips button[aria-pressed="true"] { border-color: var(--blue); color: var(--fg) }
.qhead { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap }
.qhead h1 { font-family: var(--display); font-size: 30px; font-weight: 800 }
.qhead .px { font-family: var(--display); font-size: 26px; font-weight: 700 }
.chart { height: 380px; width: 100%; border-radius: var(--r-md); overflow: hidden }
@media (max-width: 600px) { .chart { height: 300px } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2) }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px }
.tf { display: flex; gap: 4px; flex-wrap: wrap }
.tf button { border: 0; background: var(--pane); color: var(--fg-2); padding: 5px 10px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer }
.tf button[aria-pressed="true"] { background: var(--blue); color: #fff }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; align-items: start }
.verdict { display: flex; gap: 12px; align-items: flex-start }
.verdict .badge { flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-family: var(--display) }
.verdict .badge.go { background: color-mix(in srgb, var(--mint) 22%, transparent); color: var(--mint) }
.verdict .badge.no { background: color-mix(in srgb, var(--amber) 22%, transparent); color: var(--amber) }
.verdict p { margin: 4px 0 0; color: var(--fg-2); font-size: 13.5px }
ul.reads { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px }
ul.reads li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 13.5px; color: var(--fg-2) }
ul.reads li::before { content: attr(data-i); font-family: var(--display); font-weight: 800; font-size: 11px; color: var(--cyan); background: color-mix(in srgb, var(--cyan) 15%, transparent); border-radius: 7px; height: 22px; display: grid; place-items: center }
details.more { color: var(--fg-2); font-size: 13px }
details.more summary { cursor: pointer; color: var(--cyan); font-weight: 600; list-style: none }
details.more summary::-webkit-details-marker { display: none }
details.more[open] summary { margin-bottom: 8px }

/* ---------- performance / lab ---------- */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.bars { display: flex; flex-direction: column; gap: 12px }
.bar-r { display: grid; grid-template-columns: 96px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 13px }
.bar-t { height: 10px; background: var(--pane); border-radius: 99px; position: relative; overflow: hidden }
.bar-t i { position: absolute; top: 0; bottom: 0; border-radius: 99px }
.tc { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; background: var(--card); border-radius: var(--r-md) }
.tc b { font-family: var(--display); font-weight: 800 } .tc div > span { font-size: 12px; color: var(--muted) }
.tc .r { text-align: right } .tc .r b { display: block; font-size: 15px } .tc .r small { font-size: 11.5px; color: var(--muted) }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
.tbl td.r, .tbl th.r { text-align: right } .tbl tr.win td { background: color-mix(in srgb, var(--blue) 10%, transparent) }
.scroll { overflow-x: auto }
.seg { display: inline-flex; background: var(--pane); border-radius: 12px; padding: 3px; gap: 2px }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 9px; color: var(--fg-2); font-weight: 600; font-size: 12.5px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--card-2); color: var(--fg) }
.yr { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 12.5px }
.yr .pair { display: flex; flex-direction: column; gap: 4px }
.yr .b { height: 9px; border-radius: 99px; min-width: 2px }
.acct-in { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line-2); border-radius: 12px; padding: 4px 10px; font-size: 12.5px; color: var(--fg-2) }
.acct-in input { width: 86px; background: none; border: 0; font-family: var(--display); font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; padding: 2px 0 }

/* ---------- tab bar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--pane) 94%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px) }
.tabbar button { background: none; border: 0; height: var(--tabbar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer }
.tabbar svg { width: 22px; height: 22px }
.tabbar button[aria-current="page"] { color: var(--fg) }
.tabbar button[aria-current="page"] svg { color: var(--blue); filter: drop-shadow(0 4px 8px rgba(79, 125, 255, .6)) }
.view { display: flex; flex-direction: column; gap: 26px; min-width: 0 }
.view[hidden] { display: none !important }
.foot { color: var(--muted); font-size: 12px; text-align: center; padding-top: 6px }
</style>

<div class="app">
  <aside class="rail" id="rail" aria-label="계좌"></aside>

  <main class="main">
    <header class="top">
      <div class="brand"><i>α</i>Alpha Desk</div>
      <nav class="topnav" id="topnav" aria-label="화면"></nav>
      <span class="grow"></span>
      <span class="pill" id="mkt"><span class="dot"></span><span>시장</span></span>
      <span class="pill" id="asof"><span>데이터</span><b>-</b></span>
    </header>

    <!-- TODAY -->
    <section class="view" id="v-today">
      <div class="m-only" id="m-acct"></div>
      <div class="tiles" id="tiles"></div>
      <div class="sec" id="todo"></div>
      <div class="sec" id="holds"></div>
      <div class="sec m-feed" id="m-feed"></div>
    </section>

    <!-- STOCK -->
    <section class="view" id="v-stock" hidden>
      <div class="sec">
        <form class="search" id="q-form" autocomplete="off">
          <input id="q" list="q-list" placeholder="티커 검색 (예: TEM, NVDA)" aria-label="티커">
          <datalist id="q-list"></datalist>
          <button class="btn solid" type="submit">보기</button>
        </form>
        <div class="chips" id="q-chips"></div>
      </div>
      <div id="q-out"></div>
    </section>

    <!-- PERFORMANCE -->
    <section class="view" id="v-perf" hidden></section>

    <!-- LAB -->
    <section class="view" id="v-lab" hidden></section>

    <p class="foot" id="foot"></p>
  </main>

  <aside class="feed pane" id="feed" aria-label="활동"></aside>
</div>

<nav class="tabbar" id="tabbar" aria-label="화면"></nav>

<script>
const DeskEngine = (() => {
// Analyst desk: every evening the desk reads the day's candidate lists, classifies each chart the way a
// swing-trading analyst would (breakout, tight base, trend pullback, oversold reversal), writes a trade
// plan (trigger, stop, first target, trailing average) and chooses position sizes from a fixed risk budget.
// The picks are stored once and never edited; the paper account is replayed from them every night on real
// daily bars, so win rate and P&L are reproducible from the stored picks plus prices.
//
// Fill conventions (conservative, daily bars only): orders work from the session after the pick; a bar that
// touches both the stop and a profit level is treated as stopped first; gaps through a stop fill at the open.

const DESK_RULES = {
  version: 6,
  startEquity: 100_000,
  costPerSide: 0.001,            // commission + spread, each side (liquid names)
  costSmallPerSide: 0.0025,      // small caps and sub-$10 stocks: wider spreads
  stopSlippage: 0.002,           // a resting stop fills a little below its price

};
/** The ICT book: a sweep of a swing low, then a displacement close through the lower swing high (MSS), bought at the next
 * open, stop under the swept low, everything sold at buy-side liquidity (60-day high). No trend / strength / volume filters:
 * in the 3-year test (538 stocks) this raw daily form had the most trades and the best result of the ICT variants
 * (92 trades, win 37%, -0.00R; first two years -0.10R, last year +0.16R), so it runs in its own paper account. */
const ICT_RULES = { ...DESK_RULES, setups: ['structure'], mssRaw: true, volumeRules: false, mssEntry: 'market', mssExit: 'liquidity', mssMinRR: 1.5, mssDiscount: null,

const FUND_NAME = /\b(ETF|ETN|Fund|Trust|ProShares|Direxion|iShares|SPDR|Invesco QQQ|Leveraged|Ultra(Pro|Short)?|[23]x)\b/i;

const SETUP_LABEL = { gap: '갭 상승 돌파', breakout: '신고가 돌파', structure: '구조 전환(MSS)', base: '수축 후 돌파 대기', pullback: '추세 눌림목', reversal: '과매도 반등' };
const capBucket = (mcap) => (mcap == null ? '미분류' : mcap >= 10e9 ? '대형주' : mcap >= 2e9 ? '중형주' : '소형주');

// ---------- indicators ----------
function emaSeries(cl, n) { const o = new Array(cl.length).fill(NaN), k = 2 / (n + 1); let e = NaN; for (let i = 0; i < cl.length; i++) { if (i === n - 1) { let s = 0; for (let j = 0; j < n; j++) s += cl[j]; e = s / n; } else if (i >= n) e = cl[i] * k + e * (1 - k); o[i] = e; } return o; }

const series = new WeakMap();

function seriesFor(bars) {

  for (let j = Math.max(0, i - 9); j <= i; j++) lo10 = Math.min(lo10, bars[j].l);
  for (let j = Math.max(0, i - 251); j <= i; j++) hi52 = Math.max(hi52, bars[j].h);
  const nv = Math.min(20, i + 1); for (let j = i - nv + 1; j <= i; j++) { v20 += bars[j].v; dv20 += bars[j].v * bars[j].c; }
  const lr = []; for (let j = Math.max(1, i - 59); j <= i; j++) lr.push(Math.log(s.cl[j] / s.cl[j - 1]));
  const m = lr.reduce((a, b) => a + b, 0) / (lr.length || 1);
  const vol60 = lr.length > 10 ? Math.sqrt(lr.reduce((a, b) => a + (b - m) ** 2, 0) / (lr.length - 1) * 252) : null;

    atr: atr14, atrPct: atr14 / c, contraction: atr10 / atr50, rsi: rsiAt(s.cl, i), hi20, hi52, lo5, lo10,

/** Heavy-volume down days in the last `n` sessions: [{ i, ret, vol }] (vol = multiple of the prior 20-day average). */
function distributionDays(bars, i, atrPct, rules = DESK_RULES) {
  const out = [];
  for (let k = Math.max(21, i - rules.distributionLookback + 1); k <= i; k++) {
    let v = 0; for (let j = k - 20; j < k; j++) v += bars[j].v;
    const avg = v / 20, ret = bars[k].c / bars[k - 1].c - 1;

}
/** Rolling weekly bars: 5-session blocks ending at bar i (the last block ends today). */
function weeklyBars(bars, i) {
  const out = [];
  for (let e = i; e - 4 >= 0; e -= 5) { let h = -Infinity, l = Infinity, v = 0; for (let j = e - 4; j <= e; j++) { h = Math.max(h, bars[j].h); l = Math.min(l, bars[j].l); v += bars[j].v; } out.push({ o: bars[e - 4].o, h, l, c: bars[e].c, v }); }

/** Volume character over the last n sessions: up-day volume / down-day volume, and the last 5 days' volume vs the n-day average. */
function volumeProfile(bars, i, n = 50) {
  let up = 0, dn = 0, all = 0, k = 0;

  const avg = k ? all / k : 0;
  return { udRatio: dn > 0 ? up / dn : null, dryUp: avg > 0 ? v5 / Math.min(5, i + 1) / avg : null };
}

/**
 * Bullish market structure shift on daily bars (ICT reading): in the pullback after an advance, price sets a swing low,
 * bounces to a lower swing high, then runs the swing low's sell stops (the sweep) and closes back above it; the shift
 * is the first close through that lower swing high on a wide, full-bodied bar. Returns null or the levels involved.
 */
function structureShift(bars, i, atr, rules = DESK_RULES) {
  const k = rules.mssPivot, b = bars[i];

  const swingHigh = (j) => { for (let t = j - k; t <= j + k; t++) if (t !== j && bars[t].h >= bars[j].h) return false; return true; };
  const swingLow = (j) => { for (let t = j - k; t <= j + k; t++) if (t !== j && bars[t].l <= bars[j].l) return false; return true; };
  // the pullback's last swing high, confirmed before today, that today closes through for the first time
  let jH = -1;

  if (jH < 0) return null;
  const H = bars[jH].h;
  if (!(b.c > H && bars[i - 1].c <= H)) return null;
  // the sweep: the lowest low after the swing high
  let s = -1; for (let j = jH + 1; j < i; j++) if (s < 0 || bars[j].l < bars[s].l) s = j;
  if (s < 0) return null;
  // the swing low it swept: the latest swing low before the swing high
  let jL = -1; for (let j = jH - 1; j >= Math.max(k, jH - rules.mssLookback); j--) if (swingLow(j)) { jL = j; break; }
  if (jL < 0) return null;

/**

const r2 = (x) => Math.round(x * 100) / 100;

/**

function analyze(bars, i, meta = {}, rules = DESK_RULES) {

    setup = 'gap'; entryType = 'buy-stop'; trigger = x.h * 1.001; validDays = 3;
    stop = x.l - 0.1 * x.atr;
  } else if (on.has('breakout') && up && x.c > x.hi20 && nearHigh >= 0.97 && x.relVol >= 1.4 && x.ret1 > 0) {
    setup = 'breakout'; entryType = 'market'; trigger = x.c; validDays = 1;
    stop = clamp(x.lo5 - 0.25 * x.atr, trigger - 2.5 * x.atr, trigger - 1.2 * x.atr);
    // research: wait for the breakout to come back and retest the old high (a limit there) instead of paying the next open
    if (rules.breakoutEntry === 'retest') { entryType = 'limit'; validDays = 3; trigger = Math.min(x.c, x.hi20 * 1.002); }
  } else if (on.has('structure') && (rules.mssRaw || (up && volOk(rules.mssVol))) && (mss = (() => {
    const tf = rules.mssTf === 'W' ? weeklyBars(bars, i) : bars, ti = rules.mssTf === 'W' ? tf.length - 1 : i, ta = rules.mssTf === 'W' ? atrAt(tf, ti, 14) : x.atr;
    const m = structureShift(tf, ti, ta, rules); if (m) { m.tfAtr = ta; m.tf = tf; } return m;
  })())) {
    setup = 'structure'; stop = mss.sweepLow - 0.2 * (rules.mssTf === 'W' ? x.atr : x.atr);
    if (rules.mssEntry === 'market') { entryType = 'market'; trigger = x.c; validDays = 1; }
    else { // retrace into the gap (its top) or the order block (its top), never below the old swing high's midpoint to the close
      const zone = mss.fvg ? mss.fvg[1] : mss.ob ? mss.ob.hi : (mss.swingHigh + x.c) / 2;
      entryType = 'limit'; trigger = Math.min(x.c, Math.max(zone, stop + 1.2 * x.atr)); validDays = rules.mssValidDays;
    }
    // dealing range (60 sessions, or 26 weeks on the weekly chart): buy-side liquidity above (its high), discount below its midpoint
    const rb = mss.tf, re = rules.mssTf === 'W' ? rb.length - 1 : i, rn = rules.mssTf === 'W' ? 26 : 60;
    let rHi = 0, rLo = Infinity; for (let j = Math.max(0, re - rn); j < re; j++) { rHi = Math.max(rHi, rb[j].h); rLo = Math.min(rLo, rb[j].l); }
    delete mss.tf;
    mss.rangeHi = rHi; mss.rangeLo = rLo;
    if (rules.mssDiscount != null && trigger > rLo + rules.mssDiscount * (rHi - rLo)) return { pass: `구조 전환이지만 진입가가 60일 범위의 ${(((trigger - rLo) / (rHi - rLo)) * 100).toFixed(0)}% 위치(프리미엄 구간)` };
    if (rules.mssExit === 'liquidity') {
      mss.liquidity = rHi;
      if (rHi - trigger < rules.mssMinRR * (trigger - stop)) return { pass: `구조 전환이지만 위 유동성 $${r2(rHi)}까지 ${((rHi - trigger) / (trigger - stop)).toFixed(1)}R, 보상 부족` };
    }
  } else if (on.has('base') && up && x.c >= x.hi20 * 0.94 && x.c <= x.hi20 && x.contraction < 0.8 && nearHigh >= 0.85) {
    setup = 'base'; entryType = 'buy-stop'; trigger = x.hi20 * 1.002; validDays = 10;
    stop = clamp(x.lo10 - 0.2 * x.atr, trigger - 2.5 * x.atr, trigger - 1.2 * x.atr);
  } else if (on.has('pullback') && up && nearHigh >= 0.8 && x.rsi != null && x.rsi >= 36 && x.rsi <= 55 && (x.c < x.ema20 || Math.abs(x.c / x.sma50 - 1) < 0.025)) {
    setup = 'pullback'; entryType = 'buy-stop'; trigger = x.h * 1.001; validDays = 5;
    stop = clamp(x.lo5 - 0.3 * x.atr, trigger - 2.5 * x.atr, trigger - 1.2 * x.atr);
  } else if (on.has('reversal') && Number.isFinite(x.sma200) && x.c > x.sma200 && x.rsi != null && x.rsi < (rules.revRsi ?? 32) && x.ret5 < (rules.revRet5 ?? -0.08)) {
    setup = 'reversal'; entryType = 'buy-stop'; trigger = x.h * 1.001; validDays = 3; riskMult = 0.5;
    stop = clamp(x.l - 0.5 * x.atr, trigger - 3 * x.atr, trigger - 1.5 * x.atr);
  }
  if (!setup) return { pass: `정해 둔 자리(${[...on].map((k) => SETUP_LABEL[k]).join('·')}) 중 어디에도 해당하지 않음` };
  // research: a short-term trader's stop sits just under the signal bar (3 bars for a base), not 1.2-2.5 ATRs away,
  // so the same move pays more R. minStopPct below still keeps it out of the noise.
  if (rules.stopMode === 'tight' && setup !== 'structure') {
    const ref = setup === 'base' ? Math.min(bars[i].l, bars[i - 1].l, bars[i - 2].l) : x.l;
    stop = Math.max(stop, ref - 0.1 * x.atr);
  }
  stop = Math.min(stop, trigger * (1 - rules.minStopPct));
  const stopPct = 1 - stop / trigger;
  if (stopPct > rules.maxStopPct) return { pass: `손절폭 ${(stopPct * 100).toFixed(1)}% 과다` };

  const reasons = [], warnings = [];
  const rs = x.ret126 != null && meta.spyRet126 != null ? x.ret126 - meta.spyRet126 : null;
  // buy weakness only in leaders: a pullback or base in a stock lagging the market is not a setup
  if ((setup === 'pullback' || setup === 'base' || (setup === 'structure' && !rules.mssRaw)) && rs != null && rs < 0) return { pass: `${SETUP_LABEL[setup]}지만 6개월 수익률이 SPY보다 약함` };
  // a pullback is quiet: sellers hitting the stock on heavy volume is a breakdown, not a buying chance
  const dist = distributionDays(bars, i, x.atrPct, rules);
  if (dist.length && (setup === 'pullback' || setup === 'base' || setup === 'reversal')) {
    const w = dist.reduce((a, b) => (b.ret < a.ret ? b : a));
    return { pass: `최근 ${rules.distributionLookback}거래일에 대량 하락일(${pctS(w.ret)}, 거래량 ${w.vol.toFixed(1)}배) — 눌림이 아니라 매도 압력` };
  }
  if (dist.length && setup === 'structure') reasons.push(`대량 하락(${dist.length}번)으로 손절 물량을 턴 뒤 되돌림 — 매도 흡수 확인`);
  else if (dist.length) warnings.push(`최근 대량 하락일 ${dist.length}번 — 돌파 실패 위험`);
  // earningsIn: number = sessions to the report, null = calendar checked and nothing within 30 sessions,
  // undefined = this symbol's date is unknown (missing from the calendar)
  if (meta.earningsIn === null && meta.earningsChecked) reasons.push('30거래일 안에 실적 발표 없음');
  if (meta.earningsIn === undefined && meta.earningsChecked !== null) { warnings.push('실적 발표일을 확인하지 못함, 주문 전에 직접 확인'); }
  else if (meta.earningsIn != null && meta.earningsIn <= 20) warnings.push(`${meta.earningsIn}거래일 뒤 실적 발표, 그 전에 +1R 보호가 안 되면 정리`);
  let q = 0.35 * (meta.score ?? 60) + { gap: 32, breakout: 30, structure: 28, base: 26, pullback: 24, reversal: 14 }[setup];
  if (rules.volumeRules) {
    const vp = volumeProfile(bars, i);
    if (vp.udRatio != null && vp.udRatio >= 1.3) { q += 4; reasons.push(`50일 상승일 거래량이 하락일의 ${vp.udRatio.toFixed(1)}배 — 매집`); }
    else if (vp.udRatio != null && vp.udRatio < 0.8) { q -= 6; warnings.push(`50일 하락일 거래량이 더 많음(${vp.udRatio.toFixed(2)}) — 분산`); }
    if ((setup === 'pullback' || setup === 'base') && vp.dryUp != null) {
      if (vp.dryUp <= 0.85) { q += 4; reasons.push(`쉬는 동안 거래량이 평소의 ${(vp.dryUp * 100).toFixed(0)}%로 마름`); }
      else if (vp.dryUp >= 1.2) { q -= 6; warnings.push(`쉬는 동안 거래량이 평소의 ${(vp.dryUp * 100).toFixed(0)}% — 조용한 눌림이 아님`); }
    }
  }
  if (rs != null) { q += clamp(rs * 40, -10, 15); if (rs > 0.15) reasons.push(`6개월 수익률이 SPY보다 ${pctS(rs, 0)}p 강함`); else if (rs < 0) warnings.push(`6개월 수익률이 SPY보다 약함 (${pctS(rs, 0)}p)`); }
  if (up) { q += 8; reasons.push('50일선이 200일선 위 정배열'); }
  if (x.relVol > 1.5 && x.ret1 > 0) { q += 5; reasons.push(`상승일 거래량 평소의 ${x.relVol.toFixed(1)}배`); }
  if (x.relVol > 1.5 && x.ret1 < 0) { q -= 4; warnings.push(`하락일 거래량 평소의 ${x.relVol.toFixed(1)}배`); }
  if (x.rsi > 72) { q -= 8; warnings.push(`RSI ${x.rsi.toFixed(0)}로 단기 과열`); }
  if (x.ext50 > 0.15) { q -= 6; warnings.push(`50일선 위 ${pctS(x.ext50, 0)} 떠 있음`); }
  if (x.vol60 > 0.8) { q -= 5; warnings.push(`연 변동성 ${(x.vol60 * 100).toFixed(0)}%`); }
  if (setup === 'base' && x.contraction < 0.65) { q += 3; reasons.push(`최근 변동폭이 50일 평균의 ${(x.contraction * 100).toFixed(0)}%로 수축`); }
  if (dil) {
    const reg = dil.recent.filter((d) => /^(S-|F-)/i.test(d.form));
    if (dil.shelf || reg.some((d) => /^(S-1|F-1)/i.test(d.form))) { q -= 5; warnings.push(`증자 가능 서류 제출(${reg.map((d) => `${d.form} ${d.date}`).slice(0, 2).join(', ')})`); }
    else if (dil.likelyDebt) warnings.push('최근 424B 공시가 있으나 대형주라 채권 발행일 가능성이 큼');
    else if (!dil.count) reasons.push('최근 180일 증자 공시 없음');
  } else if (meta.dilutionChecked === false) warnings.push('증자 공시를 확인하지 못함');

  const trail = rules.trailMa ? { ma: rules.trailMa, label: { sma50: '50일선', ema20: '20일 지수이평', ema10: '10일 지수이평' }[rules.trailMa] } : trailFor(x.atrPct), R = trigger - stop, exitAt = mss?.liquidity ?? (rules.exitAtR ? trigger + rules.exitAtR * (trigger - stop) : null), target = exitAt ?? trigger + rules.partialAtR * R;
  const lead = {
    gap: `${pctS(gapPct, 1)} 갭 상승으로 시작해 거래량 ${x.relVol.toFixed(1)}배로 고가 근처에서 마감했습니다. 갭 당일 고가 $${r2(x.h)}를 넘으면 사고, 갭 당일 저가 $${r2(x.l)}가 깨지면 갭이 실패한 것이라 손절합니다.`,
    breakout: `20일 고점 $${r2(x.hi20)}을 거래량 ${x.relVol.toFixed(1)}배로 넘었고 52주 고점의 ${(nearHigh * 100).toFixed(0)}% 자리입니다. 돌파 다음 날 시가에 삽니다(시가가 ${(rules.maxChase * 100).toFixed(0)}% 넘게 뛰면 추격하지 않음).`,
    base: `고점 $${r2(x.hi20)} 바로 아래에서 변동폭이 줄며 쉬고 있습니다. $${r2(trigger)}를 넘는 날 돌파 매수, ${validDays}거래일 안에 안 넘으면 주문을 거둡니다.`,
    pullback: `상승 추세 속에서 ${x.c < x.ema20 ? '20일 지수이평 아래로' : '50일선까지'} 눌렸고 RSI ${x.rsi.toFixed(0)}입니다. 오늘 고점 $${r2(trigger)}를 다시 넘어 반등이 확인되면 삽니다.`,
    structure: mss ? `상승 추세의 조정 중 스윙 저점 $${r2(mss.swingLow)} 아래 손절 물량을 $${r2(mss.sweepLow)}까지 쓸고(유동성 사냥) 되돌린 뒤, 오늘 직전 스윙 고점 $${r2(mss.swingHigh)}를 장대 양봉(거래량 ${x.relVol.toFixed(1)}배)으로 종가 돌파해 구조가 상승으로 바뀌었습니다. ${entryType === 'market' ? '다음 날 시가에 삽니다.' : `${mss.fvg ? `갭(FVG) $${r2(mss.fvg[0])}~$${r2(mss.fvg[1])}` : mss.ob ? `오더블록 $${r2(mss.ob.lo)}~$${r2(mss.ob.hi)}` : '돌파 구간'}으로 되돌릴 때 $${r2(trigger)} 지정가로 사고, ${validDays}거래일 안에 안 오면 주문을 거둡니다.`} 쓸고 간 저점 아래가 손절입니다.` : '',
    reversal: `200일선 위 종목이 5일 ${pctS(x.ret5, 0)} 급락해 RSI ${x.rsi.toFixed(0)}입니다. 오늘 고점 $${r2(trigger)} 회복 때만 들어가고, 위험은 평소의 절반만 겁니다.`,
  }[setup];
  const thesis = exitAt != null
    ? `${lead} 손절은 $${r2(stop)}(${pctS(-stopPct)}), 목표는 위쪽 유동성(60일 고점) $${r2(exitAt)}(+${((exitAt - trigger) / R).toFixed(1)}R)에서 전량 정리합니다.`
    : rules.partialFrac > 0
      ? `${lead} 손절은 $${r2(stop)}(${pctS(-stopPct)}), 1차 목표 $${r2(target)}(+${rules.partialAtR}R)에서 절반 익절 후 나머지는 ${trail.label} 종가 이탈 때 정리합니다.`
      : `${lead} 손절은 $${r2(stop)}(${pctS(-stopPct)}), +1R에 손절을 매수가로 올리고, $${r2(target)}(+${rules.partialAtR}R)를 넘으면 그때부터 ${trail.label} 종가 이탈까지 전량 보유합니다(중간 익절 없음).`;
  return { setup, label: SETUP_LABEL[setup], quality: Math.round(clamp(q, 0, 100)), reasons, warnings, thesis,
    plan: { entryType, trigger: r2(trigger), stop: r2(stop), target: r2(target), exitAt: exitAt != null ? r2(exitAt) : undefined, refClose: r2(x.c), validDays, riskMult, trailMa: trail.ma, trailLabel: trail.label, stopPct: r2(stopPct * 100) / 100 },
    ict: ictRead(bars, i, rules),
    structure: mss ? { swingHigh: r2(mss.swingHigh), swingLow: r2(mss.swingLow), sweepLow: r2(mss.sweepLow), fvg: mss.fvg?.map(r2) ?? null, ob: mss.ob ? { lo: r2(mss.ob.lo), hi: r2(mss.ob.hi) } : null } : undefined,
    snapshot: { close: r2(x.c), rsi: x.rsi != null ? Math.round(x.rsi) : null, atrPct: Math.round(x.atrPct * 1000) / 1000, relVol: Math.round(x.relVol * 10) / 10, ext50: x.ext50 != null ? Math.round(x.ext50 * 1000) / 1000 : null, rs126: rs != null ? Math.round(rs * 1000) / 1000 : null } };
}

/**
 * Choose the day's picks. candidates: [{ symbol, name, sector, mcap, score, source, bars, i }].
 * busy: symbols already held or with a working order. Returns { picks, passed }.
 */
function pickForDay({ date, candidates, market, spyRet126, busy = new Set(), cooldown = new Map(), volumeReliable = false, earningsChecked = null }, rules = DESK_RULES) {
  const state = market ?? 'UNKNOWN', seen = new Set(), rows = [], passed = [];
  for (const c of candidates) {
    if (seen.has(c.symbol)) continue; seen.add(c.symbol);
    if (FUND_NAME.test(c.name ?? '') || ['SPY', 'QQQ', 'TQQQ', 'SQQQ', 'SOXL', 'SOXS', 'UPRO', 'SPXL', 'IWM'].includes(c.symbol)) { passed.push({ symbol: c.symbol, why: 'ETF·레버리지 상품 제외' }); continue; }
    if (busy.has(c.symbol)) { passed.push({ symbol: c.symbol, why: '이미 보유·주문 중' }); continue; }
    if (rules.maxMcap && c.mcap && c.mcap > rules.maxMcap) { passed.push({ symbol: c.symbol, why: `시가총액 $${(c.mcap / 1e9).toFixed(0)}B, 중소형주만 봄` }); continue; }
    if (cooldown.has(c.symbol)) { passed.push({ symbol: c.symbol, why: `${cooldown.get(c.symbol)} 손절 뒤 ${rules.reentryCooldown}거래일 쉬는 중` }); continue; }
    const a = analyze(c.bars, c.i, { score: c.score, spyRet126, volumeReliable, earningsIn: c.earningsIn ?? null, earningsChecked, dilution: c.dilution ?? null, dilutionChecked: c.dilutionChecked ?? null, asOf: date }, rules);
    if (a.pass) { passed.push({ symbol: c.symbol, why: a.pass }); continue; }
    const bar = state === 'WAIT' ? rules.minQualityWait : rules.minQuality;
    if (a.quality < bar) { passed.push({ symbol: c.symbol, why: `${a.label} ${a.quality}점 (기준 ${bar}${state === 'WAIT' ? ', 진입 대기 시장' : ''})` }); continue; }
    rows.push({ c, a });
  }
  rows.sort((x, y) => y.a.quality - x.a.quality);
  const n = rules.picksPerDay[state] ?? 3, sectors = new Set(), picks = [];
  for (const { c, a } of rows) {
    if (picks.length >= n) { passed.push({ symbol: c.symbol, why: `${a.label} ${a.quality}점, 오늘 자리 부족` }); continue; }
    const sec = c.sector && c.sector !== 'Unknown' ? c.sector : null;
    if (sec && sectors.has(sec)) { passed.push({ symbol: c.symbol, why: `${sec} 이미 담음` }); continue; }
    if (sec) sectors.add(sec);
    picks.push({ symbol: c.symbol, name: c.name ?? c.symbol, sector: c.sector ?? null, cap: capBucket(c.mcap), mcap: c.mcap ?? null, source: c.source, listScore: c.score ?? null,
      setup: a.setup, label: a.label, quality: a.quality, reasons: a.reasons, warnings: a.warnings, thesis: a.thesis, structure: a.structure, ict: a.ict, plan: { ...a.plan, riskPct: (rules.riskPct[state] ?? 0.006) * a.plan.riskMult }, snapshot: a.snapshot, earningsIn: c.earningsIn ?? null, dilution: c.dilution ?? null });
  }
  return { date, market: state, picks, passed };
}

/**
 * Replay the paper account. ledgers: [{ date, live, market, picks }] sorted by date.
 * data: { cal: ['YYYY-MM-DD'], get(symbol) -> { s, bars } | null }.
 */
function replayDesk(ledgers, data, rules = DESK_RULES, opts = {}) {
  const cal = data.cal, idxOf = (date) => { let lo = 0, hi = cal.length - 1, a = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (cal[m] <= date) { a = m; lo = m + 1; } else hi = m - 1; } return a; };
  const bar = (sym, d) => { const x = data.get(sym); if (!x || d < x.s || d - x.s >= x.bars.length) return null; const b = x.bars[d - x.s]; return b; };
  const lastClose = (sym, d) => { const x = data.get(sym); if (!x) return null; const k = Math.min(d - x.s, x.bars.length - 1); return k >= 0 ? x.bars[k].c : null; };
  const maAt = (sym, d, ma) => { const x = data.get(sym); if (!x || d < x.s) return NaN; return seriesFor(x.bars)[ma][d - x.s]; };
  const byDay = new Map(); for (const l of ledgers) { const d = idxOf(l.date); if (d >= 0) (byDay.get(d) ?? byDay.set(d, []).get(d)).push(l); }
  // opts.picker(d, { busy, cooldown }) -> { date, market, picks } lets a backtest choose picks session by session
  // from the account's own state, in one pass. opts.start / opts.end bound the sessions replayed.
  const first = opts.start ?? Math.min(...byDay.keys()), endIdx = opts.end ?? cal.length - 1;
  const generated = [];
  let cash = rules.startEquity, prevEquity = rules.startEquity;
  const open = [], pending = [], trades = [], equity = [], outcomes = new Map(), events = [];
  const spy = data.get('SPY'), spyStart = spy ? bar('SPY', first) : null;
  const key = (date, sym) => `${date}:${sym}`;
  const costRate = (p, px) => (p.cap === '소형주' || px < 10 ? rules.costSmallPerSide : rules.costPerSide);
  const nextReport = (sym, d) => { const list = data.earnings?.(sym); if (!list) return null; const today = cal[d]; return list.find((e) => e.date >= today) ?? null; };
  const spyOpenAt = (d) => bar('SPY', d)?.o ?? null, spyCloseAt = (d) => bar('SPY', d)?.c ?? null;
  let peak = rules.startEquity, haltSince = null, recovering = false, restartEq = null;

  const close = (pos, d, px, reason) => {
    const cost = (v) => v * pos.costRate;
    const proceeds = pos.shares * px; cash += proceeds - cost(proceeds);
    pos.realized += pos.shares * (px - pos.entry) - cost(proceeds); pos.exitValue += proceeds; pos.exitShares += pos.shares; pos.shares = 0;
    const exitPx = pos.exitValue / pos.exitShares, pnl = pos.realized - pos.entryCost;
    const t = { symbol: pos.symbol, name: pos.name, setup: pos.setup, label: pos.label, cap: pos.cap, sector: pos.sector, live: pos.live, pickDate: pos.pickDate,
      entryDate: cal[pos.entryIdx], exitDate: cal[d], days: d - pos.entryIdx, entry: r2(pos.entry), exit: r2(exitPx), shares: pos.initShares,
      pnl: r2(pnl), pnlPct: pnl / (pos.initShares * pos.entry), R: pnl / (pos.initShares * pos.R), reason, partial: pos.partial, market: pos.market ?? null };
    const so = spyOpenAt(pos.entryIdx), sc = spyCloseAt(d);

const STATE = { SELECTIVE: ['적극 매수 가능', 'ok'], LIMIT: ['신규 진입 축소', 'warn'], WAIT: ['신규 진입 대기', 'bad'], UNKNOWN: ['판정 없음', ''] };
const SETUP = { breakout: '신고가 돌파', base: '수축 후 돌파', pullback: '추세 눌림목', reversal: '과매도 반등', structure: '구조 전환(MSS)' };
/* the daily chart under a 4-hour signal: the 4-hour structure alone does not see a stretched or blocked daily chart */
const crashRegime = () => ['급락 조정', '약세장'].includes(DATA.ict4h?.regime?.name);
/* rank 4-hour signals by what paid in the current regime (3-year backtest, 2026-11-08) */
function sigScore(s) {
  const reg = DATA.ict4h?.regime?.name, vol = s.volMult >= 1.5, disc = s.rangePos != null && s.rangePos <= 0.5;
  if (reg === '상승장' || reg === '조정·횡보') return (s.trend ? 3 : 0) + (vol ? 1 : 0) + (disc ? 0.5 : 0);
  return (vol ? 2 : 0) + (disc ? 1.5 : 0) + (s.trend ? 0.5 : 0);
}
/* the regime playbook: in up / choppy markets only trend-aligned signals paid (3 years, +0.52R vs -0.01R in chop) */
function skipNote(s) {
  const reg = DATA.ict4h?.regime?.name;
  if ((reg === '상승장' || reg === '조정·횡보') && !s.trend) return `<p class="fine" style="margin-top:8px;color:var(--fg-3)">${esc(reg)}에서는 일봉 추세 일치 신호만 받는 규칙이라 건너뜁니다.</p>`;
  return '';
}
function sigTags(s) {
  const t = [];
  if (s.volMult >= 1.5) t.push(`거래량 실린 전환 ${s.volMult.toFixed(1)}배`);
  if (s.rangePos != null && s.rangePos <= 0.5) t.push(`할인 구간 (60봉 범위 ${Math.round(s.rangePos * 100)}%)`);
  return t.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${t.map((x) => `<span class="chip mint">${esc(x)}</span>`).join('')}</div>` : '';
}
function dailyWarn(s) {
  const w = [], d = s.daily;
  if (!s.trend && !crashRegime()) w.push('일봉 50일선 아래 (역추세)');
  if (d?.ext > 2) w.push(`일봉 과열: 20일선 위 ${d.ext.toFixed(1)}ATR`);
  if (d?.overhead) w.push(`목표 전 일봉 이평 저항 ${usd(d.overhead)}`);
  if (d?.spread != null && Math.abs(d.spread) > 0.15) w.push(`20·50일선 ${pct(d.spread, 0)} 벌어짐`);
  return w.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${w.map((x) => `<span class="chip coral">${esc(x)}</span>`).join('')}</div>` : '';
}
const ST4 = { waiting: '지정가 대기', open: '보유 중', won: '목표 도달', lost: '손절', timeout: '기간 만료', expired: '미체결 만료', cancelled: '체결 전 취소' };

/* ---------------- data ---------------- */
let DATA = DATA_EMBED;
async function snap(file) {
  const bases = ON_SITE ? ['/api/v1/snapshot', SNAPSHOT] : [SNAPSHOT];
  for (const b of bases) { try { const r = await fetch(`${b}/${file}`, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch { /* next */ } }
  return null;
}
async function loadData() {
  if (DATA) return;
  const [latest, brief, desk, backtest, ict4h] = await Promise.all(['latest.json', 'market-brief/latest.json', 'desk/account.json', 'desk/backtest.json', 'desk/ict4h.json'].map(snap));
  DATA = { asOf: latest?.asOf, market: brief?.decision ? { state: brief.decision.state, label: brief.decision.label, reasons: brief.decision.reasons ?? [] } : null, desk, backtest, ict4h };
  render();
  const [real, watch] = await Promise.all(['sim/bars.json', 'sim/watch.json'].map(snap));
  DATA.real = real; DATA.watch = watch;
  if (ui.view === 'stock') renderStock();
}

/* bars for one symbol: embedded nightly files first, then the site's live daily bars */
const barCache = new Map();
function fromPayload(p, sym) { const x = p?.bars?.[sym]; if (!x) return null; return { cal: p.cal, s: x.s, bars: x.d.map(([o, h, l, c, v]) => ({ o, h, l, c, v })), earnings: p.earnings?.[sym] ?? null }; }
async function barsFor(sym) {
  if (barCache.has(sym)) return barCache.get(sym);
  let out = fromPayload(DATA.watch, sym) || fromPayload(DATA.real, sym);
  if (ON_SITE) {
    try {
      const r = await fetch(`/api/v1/bars/${encodeURIComponent(sym)}?tf=1D`);
      if (r.ok) { const j = await r.json(); let b = j.bars ?? []; if (j.lastBarClosed === false) b = b.slice(0, -1);
        const day = (t) => new Date(t * 1000).toISOString().slice(0, 10);
        if (b.length > 60 && (!out || day(b.at(-1).time) >= out.cal[out.s + out.bars.length - 1])) out = { cal: b.map((x) => day(x.time)), s: 0, bars: b.map((x) => ({ o: x.open, h: x.high, l: x.low, c: x.close, v: x.volume })), earnings: out?.earnings ?? null, live: true }; }
    } catch { /* keep the nightly copy */ }
  }
  if (out) barCache.set(sym, out);
  return out;
}

/* ---------------- shared pieces ---------------- */
const VIEWS = [['today', '오늘', '<path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>'], ['stock', '종목', '<path d="M4 19h16M6 16V9m4 7V5m4 11v-5m4 5V8"/>'], ['perf', '성과', '<path d="M4 17l5-5 4 3 7-8M15 7h5v5"/>'], ['lab', '연구', '<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/>']];
const ui = { view: 'today', sym: null, tf: '6M', ctf: ['5m', '15m', '1H', '4H', 'D', 'W', 'M'].includes(store.get('ctf', 'D')) ? store.get('ctf', 'D') : 'D', perfFilter: 'all' };
const CTF = [['5m', '5분'], ['15m', '15분'], ['1H', '1시간'], ['4H', '4시간'], ['D', '일'], ['W', '주'], ['M', '월']];
function nav() {
  const icon = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  $('#tabbar').innerHTML = VIEWS.map(([k, n, p]) => `<button data-v="${k}" ${ui.view === k ? 'aria-current="page"' : ''}>${icon(p)}<span>${n}</span></button>`).join('');
  $('#topnav').innerHTML = VIEWS.map(([k, n]) => `<button data-v="${k}" ${ui.view === k ? 'aria-current="page"' : ''}>${n}</button>`).join('');
}
function go(view, sym) {
  ui.view = view; if (sym) ui.sym = sym;
  const h = view === 'stock' && ui.sym ? `stock-${ui.sym.replace(/\./g, '--')}` : view;
  try { if (location.hash.slice(1) !== h) history.replaceState(null, '', '#' + h); } catch { /* sandbox */ }
  for (const [k] of VIEWS) $('#v-' + k).hidden = k !== view;
  nav(); render(); window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}
document.addEventListener('click', (e) => {
  const v = e.target.closest('[data-v]'); if (v) { go(v.dataset.v); return; }
  const s = e.target.closest('[data-sym]'); if (s) { go('stock', s.dataset.sym); }
});
function fromHash() { const h = location.hash.slice(1); if (h.startsWith('stock-')) return ['stock', h.slice(6).replace(/--/g, '.')]; return [VIEWS.some(([k]) => k === h) ? h : 'today', null]; }
window.addEventListener('hashchange', () => { const [v, s] = fromHash(); if (v !== ui.view || (s && s !== ui.sym)) go(v, s); });

function levels(entry, stop, target, entryLabel = '진입') {
  return `<div class="lv"><div><span>${entryLabel}</span><b>${usd(entry)}</b></div>
    <div><span>손절</span><b class="down">${usd(stop)}</b><small class="down">${stop >= entry ? '본전 보호' : pct(stop / entry - 1)}</small></div>
    <div><span>목표</span><b class="up">${usd(target)}</b><small class="up">${pct(target / entry - 1)}${entry > stop ? ` · ${((target - entry) / (entry - stop)).toFixed(1)}R` : ''}</small></div></div>`;
}
function ladder(stop, entry, target, last) {
  const lo = Math.min(stop, last), hi = Math.max(target, last), w = (x) => ((x - lo) / (hi - lo || 1)) * 100;
  return `<div class="ladder" aria-hidden="true"><span class="e" style="left:${w(entry)}%"></span><span class="p" style="left:${w(last)}%"></span></div>
    <div class="ladder-l"><span>손절 ${usd(stop)}</span><span>목표 ${usd(target)}</span></div>`;
}
function spark(el, points, color, base) {
  if (!window.LightweightCharts || !el || !points.length) return null;
  const c = LightweightCharts.createChart(el, { autoSize: true, layout: { background: { color: 'transparent' }, textColor: '#7c82ad', fontFamily: 'Manrope, sans-serif', attributionLogo: false },
    grid: { vertLines: { visible: false }, horzLines: { color: 'rgba(196,204,255,.06)' } }, rightPriceScale: { visible: false }, leftPriceScale: { visible: false },
    timeScale: { visible: false, borderVisible: false }, crosshair: { vertLine: { visible: false }, horzLine: { visible: false } }, handleScroll: false, handleScale: false });
  const s = c.addAreaSeries({ lineColor: color, topColor: color + '66', bottomColor: color + '00', lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
  s.setData(points);
  if (base) { const b = c.addLineSeries({ color: 'rgba(178,183,218,.45)', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false }); b.setData(base); }
  c.timeScale().fitContent();
  return c;
}

function drawAccountSpark(id) {

  const pts = D.equity.map((e) => ({ time: e.date, value: e.equity })), base = D.equity.map((e) => ({ time: e.date, value: e.spy }));

/* ---------------- feed ---------------- */
function feedItems() {
  const items = [];
  for (const e of DATA.desk?.events ?? []) items.push({ date: e.date, sym: e.symbol, text: e.text, src: '메인' });
  for (const e of DATA.desk?.ict?.events ?? []) items.push({ date: e.date, sym: e.symbol, text: e.text, src: 'ICT 일봉' });
  for (const s of DATA.ict4h?.signals ?? []) {
    if (s.status === 'waiting') items.push({ date: s.day, sym: s.symbol, text: `4시간봉 구조 전환. ${usd(s.limit)} 지정가 대기`, src: 'ICT 4H' });
    else if (s.filledAt) items.push({ date: s.filledAt.slice(0, 10), sym: s.symbol, text: s.R != null ? `${ST4[s.status]} ${R(s.R)}` : `${usd(s.entry)} 체결`, src: 'ICT 4H' });
  }
  return items.sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 30);
}
function feedHtml(limit = 30) {

    <button class="tile violet" onclick="document.getElementById('todo').scrollIntoView({behavior:'smooth'})"><span class="glyph">4H</span><span class="k">ICT 4시간봉 · ${esc(X?.regime?.name ?? '국면 미정')}</span><span class="v num">${sig.length}건 진행</span><span class="s">${X?.regime?.playbook ? esc(X.regime.playbook) : X?.recent?.n ? `최근 소급 ${X.recent.n}건 · 승률 ${pctU(X.recent.winRate)} · ${R(X.recent.expectancyR)}` : '신호 기록을 쌓는 중'}</span></button>`;

  const cards = [];
  for (const o of live) { const p = pick.get(`${o.pickDate}:${o.symbol}`); if (!p) continue;
    const mkt = p.plan.entryType === 'market', entry = mkt ? p.plan.refClose : p.plan.trigger, n = sizeFor(p.plan.riskPct, entry, p.plan.stop);
    cards.push(`<article class="card oc" data-sym="${esc(p.symbol)}"><div class="oc-h">${avatar(p.symbol)}<div class="t"><b>${esc(p.symbol)}</b><span>${esc(p.name)}</span></div><span class="chip blue">${esc(p.label)}</span></div>
      ${levels(entry, p.plan.stop, p.plan.target, mkt ? '내일 시가' : '돌파 매수')}
      <div class="oc-f"><span>${n}주 · ${usd(n * entry, 0)}</span><span>${mkt ? '시가 4% 넘게 뛰면 건너뜀' : `${o.sessionsLeft > 0 ? o.sessionsLeft : 1}거래일 유효`}</span></div></article>`); }
  for (const o of ictP) { const p = ipick.get(`${o.pickDate}:${o.symbol}`); if (!p) continue;
    const entry = p.plan.entryType === 'market' ? p.plan.refClose : p.plan.trigger, tgt = p.plan.exitAt ?? p.plan.target, n = sizeFor(p.plan.riskPct, entry, p.plan.stop);
    cards.push(`<article class="card oc" data-sym="${esc(p.symbol)}"><div class="oc-h">${avatar(p.symbol)}<div class="t"><b>${esc(p.symbol)}</b><span>${esc(p.name)}</span></div><span class="chip violet">ICT 일봉</span></div>

  for (const s of sig.filter((x) => x.status === 'waiting').sort((a, b) => sigScore(b) - sigScore(a))) { const n = sizeFor(0.01, s.limit, s.stop);

  // holdings: main + ICT daily + ICT 4h
  const rows = [];
  for (const p of D?.open ?? []) rows.push({ sym: p.symbol, src: p.label, entry: p.entry, stop: p.stop, target: p.target, last: p.last, pnl: p.pnlPct, r: p.R, note: p.stop >= p.entry ? '본전 보호' : `${p.days}일째` });

  for (const s of sig.filter((x) => x.status === 'open')) rows.push({ sym: s.symbol, src: 'ICT 4H', entry: s.entry, stop: s.stop, target: s.target, last: s.last, pnl: s.last / s.entry - 1, r: (s.last - s.entry) / (s.entry - s.stop), note: s.trend ? '추세 일치' : '' });
  rows.sort((a, b) => (a.last - a.stop) / (a.entry - a.stop || 1) - (b.last - b.stop) / (b.entry - b.stop || 1));

          <div class="bar-t"><i style="left:0;width:${Math.round(v.winRate * 100)}%;background:linear-gradient(90deg,#4f7dff,#7b57ff)"></i></div><b class="num ${sign(v.avgR)}" style="text-align:right">${R(v.avgR)}</b></div>`).join('')}</div>` : '<p class="dim">청산된 거래가 쌓이면 나옵니다.</p>'}
      </div>
      <div class="card sec"><div class="sec-h"><h2>ICT 장부</h2><span class="sub">메인과 따로 기록</span></div>
        <div class="stats">
          <div class="stat violet"><span class="v">${I?.closed ?? 0}건</span><span class="k">일봉 장부 청산 · 승률 ${pctU(I?.winRate)}</span></div>
          <div class="stat violet"><span class="v ${sign(I?.totalReturn ?? 0)}">${pct(I?.totalReturn ?? 0)}</span><span class="k">일봉 장부 계좌</span></div>
          <div class="stat blue"><span class="v">${X?.stats?.n ?? 0}건</span><span class="k">4H 실시간 종료 · ${X?.stats?.n ? pctU(X.stats.winRate) : '-'}</span></div>
          <div class="stat blue"><span class="v ${sign(X?.recent?.expectancyR ?? 0)}">${R(X?.recent?.expectancyR)}</span><span class="k">4H 최근 소급 ${X?.recent?.n ?? 0}건</span></div>
        </div></div>
    </div>
    <div class="sec"><div class="sec-h"><h2>매매 일지</h2><span class="grow"></span>
      <div class="seg" role="group" aria-label="일지 보기">${[['all', '전체'], ['win', '수익'], ['loss', '손실']].map(([k, n]) => `<button type="button" data-pf="${k}" aria-pressed="${ui.perfFilter === k}">${n}</button>`).join('')}</div></div>
      ${tr.length ? `<div class="hold">${tr.slice(0, 40).map((t) => `<div class="tc" data-sym="${esc(t.symbol)}" style="cursor:pointer">${avatar(t.symbol)}<div style="min-width:0"><b>${esc(t.symbol)}</b> <span>${esc(t.label)} · ${md(t.entryDate)}→${md(t.exitDate)} · ${esc(t.reason)}</span></div>
        <div class="r"><b class="num ${sign(t.pnlPct)}">${pct(t.pnlPct)}</b><small>${R(t.R)}</small></div></div>`).join('')}</div>` : '<div class="empty"><b>해당하는 거래가 없습니다</b></div>'}
    </div>`;
  $('#v-perf').querySelectorAll('[data-pf]').forEach((b) => b.addEventListener('click', () => { ui.perfFilter = b.dataset.pf; renderPerf(); }));
  spark($('#perf-eq'), D.equity.map((e) => ({ time: e.date, value: e.equity })), eq.equity >= start ? '#ff6473' : '#5c90ff', D.equity.map((e) => ({ time: e.date, value: e.spy })));
}

/* ---------------- LAB ---------------- */
const RESEARCH = [
  { title: '메인 데스크 매도 규칙', note: '538종목 · 7년(2019-10~2026-11)', head: ['방식', '거래', '승률', '거래당', '연수익', '낙폭'], win: 1, rows: [
    ['+2R 절반 익절 (v5)', 853, '35%', '+0.05R', '2.5%', '-32%'], ['50일선까지 전량 보유 (v6, 현재)', 567, '26%', '+0.12R', '3.5%', '-26%'], ['중소형주만', 967, '28%', '-0.11R', '-6.1%', '-51%']] },
  { title: 'ICT 4시간봉', note: '300종목 · 2년 · 신호별', head: ['방식', '거래', '승률', '거래당', '앞 1년', '최근 1년'], win: 1, rows: [
    ['다음 봉 시가', 429, '45%', '+0.28R', '-0.03R', '+0.72R'], ['FVG·오더블록 지정가 (현재)', 600, '40%', '+0.43R', '+0.22R', '+0.72R'], ['일봉 추세 + 지정가', 181, '45%', '+0.58R', '+0.65R', '+0.50R']] },
  { title: 'ICT 일봉', note: '538종목 · 7년', head: ['방식', '거래', '승률', '거래당', '앞 6년', '최근 1년'], win: 0, rows: [
    ['원형, 다음 날 시가 (일봉 장부)', 165, '33%', '+0.02R', '-0.03R', '+0.21R'], ['+ 거래량 1.5배', 30, '37%', '+0.03R', '-0.20R', '+0.80R'], ['주봉, 지정가', 34, '41%', '+0.11R', '+0.04R', '+0.42R']] },
];
function renderLab() {
  const B = DATA.backtest, D = DATA.desk;
  const yrs = B?.years ?? [], mx = Math.max(0.05, ...yrs.flatMap((y) => [Math.abs(y.desk), Math.abs(y.spy)]));
  $('#v-lab').innerHTML = `
    ${B ? `<div class="card sec"><div class="sec-h"><h2>메인 데스크 백테스트</h2><span class="sub">${B.from.slice(0, 7)} ~ ${B.to.slice(0, 7)} · 거래대금 상위 ${B.universe.size}종목</span></div>
      <div class="kpis">
        <div class="stat blue"><span class="v ${sign(B.cagr)}">${pct(B.cagr)}</span><span class="k">연수익 (SPY ${pct(B.spyCagr)})</span></div>
        <div class="stat violet"><span class="v">${pctU(B.stats.winRate)}</span><span class="k">승률 · ${B.stats.closed}건</span></div>
        <div class="stat coral"><span class="v down">${pct(B.stats.maxDrawdown)}</span><span class="k">최대 낙폭</span></div>
      </div>
      <div class="bars">${yrs.map((y) => `<div class="yr"><span class="num">${y.period}</span><div class="pair">
        <div style="display:flex;align-items:center;gap:8px"><span class="b" style="width:${Math.abs(y.desk) / mx * 70}%;background:${y.desk >= 0 ? '#ff6473' : '#5c90ff'}"></span><span class="num ${sign(y.desk)}" style="font-size:12px">${pct(y.desk)}</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="b" style="width:${Math.abs(y.spy) / mx * 70}%;background:rgba(178,183,218,.45)"></span><span class="num mute" style="font-size:12px">SPY ${pct(y.spy)}</span></div></div></div>`).join('')}</div>
      <details class="more"><summary>이 숫자를 읽는 법</summary>${(B.caveats ?? []).map((c) => `<p>${esc(c)}</p>`).join('')}</details></div>` : ''}
    <div class="sec"><div class="sec-h"><h2>전략 검증 기록</h2><span class="sub">같은 데이터로 비교, 앞 기간과 최근 1년이 모두 플러스여야 채택</span></div>
      ${RESEARCH.map((t) => `<div class="card sec"><div class="sec-h"><h2 style="font-size:15px">${t.title}</h2><span class="sub">${t.note}</span></div>
        <div class="scroll"><table class="tbl"><thead><tr>${t.head.map((h, k) => `<th class="${k ? 'r' : ''}">${h}</th>`).join('')}</tr></thead>
        <tbody>${t.rows.map((r, k) => `<tr class="${k === t.win ? 'win' : ''}">${r.map((c, j) => `<td class="${j ? 'r num' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('')}
    </div>
    ${D?.rules ? `<div class="card sec"><div class="sec-h"><h2>데스크가 사고파는 규칙</h2><span class="chip">v${D.rules.version}</span></div>
      <ul class="reads">
        <li data-i="1">후보: 매일 랭킹 목록. ETF·레버리지 상품 제외, 증자 공시 90일·실적 발표 5거래일 안은 사지 않음</li>
        <li data-i="2">자리: 신고가 돌파, 수축 후 돌파, 추세 눌림목, 과매도 반등. 최근 대량 하락일이 있으면 눌림으로 보지 않음</li>
        <li data-i="3">크기: 손절까지 잃는 돈이 계좌의 ${(D.rules.riskPct.SELECTIVE * 100).toFixed(1)}%(시장 대기 때 ${(D.rules.riskPct.WAIT * 100).toFixed(2)}%), 한 종목 ${D.rules.maxPositionPct * 100}% 이하, 전체 위험 ${D.rules.maxHeatPct * 100}% 이하</li>
        <li data-i="4">매도: +1R에 손절을 본전으로, 중간 익절 없이 50일선 종가 이탈까지 보유. ${D.rules.timeStopSessions}거래일 동안 +0.5R 못 넘으면 정리</li>
        <li data-i="5">계좌 낙폭 -${D.rules.ddHalfRisk * 100}%면 위험 절반, -${D.rules.ddHalt * 100}%면 ${D.rules.ddHaltSessions}거래일 매수 중단</li>
      </ul></div>` : ''}
    ${ON_SITE ? '<a class="btn" href="/simulator.html" style="align-self:flex-start">추천 복기 · 가상 시나리오 도구 열기</a>' : ''}`;
}

/* ---------------- frame ---------------- */
function render() {
  if (!DATA) return;
  const mk = DATA.market, st = STATE[mk?.state] ?? STATE.UNKNOWN;
  $('#mkt').className = `pill ${st[1]}`; $('#mkt').innerHTML = `<span class="dot"></span><b>${esc(st[0])}</b>`;
  $('#asof').innerHTML = `<span>종가</span><b class="num">${md(DATA.desk?.asOf ?? DATA.asOf)}</b>`;
  $('#rail').innerHTML = accountCard(); drawAccountSpark('#rail .spark');
  $('#feed').innerHTML = feedHtml();
  if (ui.view === 'today') renderToday(); else if (ui.view === 'stock') renderStock(); else if (ui.view === 'perf') renderPerf(); else renderLab();
  $('#foot').textContent = `모의 매매 기록입니다. 투자 판단과 책임은 본인에게 있습니다. 데스크 ${DATA.desk?.model ?? ''} · 갱신 ${(DATA.desk?.generatedAt ?? '').slice(0, 16).replace('T', ' ')} UTC`;
}
(function boot() {
  const [v, s] = fromHash(); ui.view = v; ui.sym = s;
  for (const [k] of VIEWS) $('#v-' + k).hidden = k !== v;
  nav();
  if (DATA) render(); else { $('#tiles').innerHTML = '<div class="empty" style="grid-column:1/-1"><b>데이터를 불러오는 중입니다</b>장 마감 기준 기록을 가져옵니다.</div>'; loadData().catch(() => { $('#tiles').innerHTML = '<div class="empty" style="grid-column:1/-1"><b>데이터를 불러오지 못했습니다</b>네트워크를 확인하고 새로고침해 주세요.</div>'; }); }
})();
</script>
