# Cloudflare Worker: web app (static assets from dist/) + API (/api/*) on one domain.
# Dashboard: Workers & Pages -> Create -> Import a repository -> alpha-terminal
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
name = "alpha-terminal"
main = "apps/api/src/worker.ts"
compatibility_date = "2025-09-01"

# Wrangler runs this before every deploy/versions upload, so dist/ exists even if the
# dashboard build command is left empty (it is harmless if both are set).
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[observability]
enabled = true

[vars]
ALLOWED_ORIGIN = "*"
PRICE_PROVIDERS = "stooq,yahoo"
SCREEN_MAX = "5"
# 1-minute check for a new Claude channel digest to send to the bot (apps/api/src/telegram-watch.ts)
[triggers]
crons = ["* * * * *"]

# linked bot chat and the last digest sent
[[kv_namespaces]]
binding = "TG_STATE"
id = "dd91a3ab139a4dce876613799ef484da"

# Secrets (Worker > Settings > Variables and Secrets, type "Secret"):
#   SEC_USER_AGENT     e.g. "AlphaTerminal/0.6 you@example.com"
#   ALPACA_KEY_ID, ALPACA_SECRET_KEY
#   TV_WEBHOOK_SECRET (+ optional TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
#
# Optional TradingView alert history: create a KV namespace and bind it as ALERTS
#   npx wrangler kv namespace create ALERTS
# [[kv_namespaces]]
# binding = "ALERTS"
# id = "<namespace id>"
